services:
  app:
    build: .
    container_name: drawn-app
    ports:
      - "5173:5173" # Web app (Next.js frontend)
      - "8080:8080" # Linera faucet + node service
      - "9001:9001" # Shard proxy
      - "13001:13001" # Shard validator
    volumes:
      - .:/build
    environment:
      - RUST_LOG=info
    labels:
      - "com.linera.buildathon.app=drawn"
      - "com.linera.buildathon.description=NFT Sticker Collection Game"
